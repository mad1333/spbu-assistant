server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name do-not-miss-classes.185-73-124-36.sslip.io;

    ssl_certificate /etc/letsencrypt/live/do-not-miss-classes.185-73-124-36.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/do-not-miss-classes.185-73-124-36.sslip.io/privkey.pem;
    ssl_dhparam /etc/nginx/dhparam.pem;

    client_max_body_size 16k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded $proxy_add_forwarded;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
